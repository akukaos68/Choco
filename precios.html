<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Precios – Olas de Cacao</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@700&family=Pinyon+Script&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: url('choco7.jpeg') center center / cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      font-family: 'Nunito', sans-serif;
      margin-top: 0;
    }
    .card {
      background: rgba(190, 175, 210, 0.52);
      border-radius: 18px;
      padding: 2.2rem 2rem 1.8rem;
      max-width: 390px;
      width: 100%;
    }
    .titulo {
      font-family: 'Dancing Script', cursive;
      font-size: 3.4rem;
      color: #4a2e1a;
      text-align: center;
      margin-bottom: 1.6rem;
      line-height: 1;
    }
    ul { list-style: none; margin: 0 0 1.4rem; }
    ul li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.45rem 0;
    }
    ul li::before {
      content: "•";
      color: #4a2e1a;
      font-size: 1.2rem;
      margin-right: 0.55rem;
      flex-shrink: 0;
    }
    ul li a {
      color: #4a2e1a;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      flex: 1;
    }
    ul li a:hover { opacity: 0.75; text-decoration: underline; }
    ul li .precio {
      color: #4a2e1a;
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      margin-left: 1rem;
    }
    .sello {
      text-align: center;
      margin: 1rem 0 0.5rem;
    }
    .sello-circulo {
      display: inline-block;
      border: 1.5px dashed #7a5c3a;
      border-radius: 50%;
      padding: 0.5rem 0.9rem;
      color: #7a5c3a;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      line-height: 1.5;
      text-transform: uppercase;
    }
    .corazon { color: #c07080; font-size: 1.2rem; display: block; text-align: center; margin: 0.3rem 0; }
    .tagline {
      text-align: center;
      color: #4a2e1a;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.5;
    }
    .nav-logo {
      font-family: "Pinyon Script", cursive;
      font-size: 2.2rem;
      color: #5a3e2b;
      text-decoration: none;
      display: inline-block;
      line-height: 1;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #f5ece0;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e8d5bf;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 10px rgba(92,58,30,0.08);
    }
    nav {
      display: flex;
      gap: 30px;
    }
    nav a {
      text-decoration: none;
      color: #5c3a1e;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      position: relative;
      padding-bottom: 4px;
      transition: color 0.3s;
    }
    nav a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background-color: #e8a09a;
      transition: width 0.3s ease;
    }
    nav a:hover {
      color: #e8a09a;
    }
    nav a:hover::after {
      width: 100%;
    }
    .logo-link {
      text-decoration: none;
    }
  </style>
</head>
<body>
  <!-- ENCABEZADO -->
  <header>
    <a href="index.html" class="logo-link"><h1 class="nav-logo">Olas de Cacao</h1></a>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="precios.html">Productos</a>
      <a href="https://www.instagram.com/olasdecacao/" target="_blank">Contacto</a>
    </nav>
  </header>

  <div class="card">
    <h1 class="titulo">Chocolates</h1>
    <ul id="lista-precios">
  <!-- Los productos se cargan con JS -->
    </ul>
    <div class="sello">
    </div>
    <span class="corazon">♡</span>
    <p class="tagline">¡No te pierdas nuestras<br>delicias de esta temporada!</p>
  </div>
</body>
  <script>
  fetch('productos.json')
    .then(res => res.json())
    .then(data => {
      const lista = document.getElementById('lista-precios');
      data.productos.forEach(p => {
        lista.innerHTML += `
          <li>
            <a href="${p.link}">${p.nombre}</a>
            <span class="precio">${p.precio}</span>
          </li>
        `;
      });
    });
  </script>
</html>
