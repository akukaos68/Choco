<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos - Olas de Cacao</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="eventos.css" />
</head>
<body>
  <!-- ENCABEZADO -->
  <header id="header">
    <a href="index.html" class="logo-link"><h1 class="nav-logo">Olas de Cacao</h1></a>
    <div class="hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <nav id="navMenu">
      <a href="index.html">Inicio</a>
      <a href="precios.html">Productos</a>
      <a href="contacto.html" target="_blank">Contacto</a>
    </nav>
  </header>

  <!-- Botón Instagram flotante -->
  <a href="https://www.instagram.com/olasdecacao/" target="_blank" class="instagram-button" title="Síguenos en Instagram">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white">
      <path d="M7.75 2C4.57 2 2 4.57 2 7.75v8.5C2 19.43 4.57 22 7.75 22h8.5C19.43 22 22 19.43 22 16.25v-8.5C22 4.57 19.43 2 16.25 2h-8.5zm0 2h8.5A3.75 3.75 0 0 1 20 7.75v8.5A3.75 3.75 0 0 1 16.25 20h-8.5A3.75 3.75 0 0 1 4 16.25v-8.5A3.75 3.75 0 0 1 7.75 4zm8.75 1a1 1 0 1 0 0 2 1 1 0 0 0 0-2zM12 6.5A5.5 5.5 0 1 0 17.5 12 5.5 5.5 0 0 0 12 6.5zm0 2A3.5 3.5 0 1 1 8.5 12 3.5 3.5 0 0 1 12 8.5z"/>
    </svg>
  </a>

  <main id="evento-container">
    <div class="evento-header">
      <img id="imagen-portada" src="" alt="Evento">
    </div>
    
    <div class="evento-contenido">
      <img id="imagen-superior-izq" src="" alt="Imagen del evento">
      <div id="texto-body" class="evento-texto"></div>
      <img id="imagen-medio-derecha" src="" alt="Imagen complementaria">
    </div>
  </main>

  <script>
    // Menú hamburguesa
    const hamburger = document.getElementById('hamburger');
    const navMenu = document.getElementById('navMenu');
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      navMenu.classList.toggle('active');
    });

    // Cerrar menú al hacer clic en un link
    navMenu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        hamburger.classList.remove('active');
        navMenu.classList.remove('active');
      });
    });

    // Cargar datos del evento
    fetch('eventos.json')
      .then(response => response.json())
      .then(data => {
        // Fondo del body
        if (data.background_imagen) {
          document.body.style.backgroundImage = `url('${data.background_imagen}')`;
          document.body.style.backgroundRepeat = 'no-repeat';
          document.body.style.backgroundSize = 'cover';
          document.body.style.backgroundPosition = 'center';
          document.body.style.backgroundAttachment = 'fixed';
        }

        // Fondo del header
        if (data.header_fondo) {
          const header = document.getElementById('header');
          header.style.backgroundImage = `url('${data.header_fondo}')`;
          header.style.backgroundSize = 'cover';
          header.style.backgroundPosition = 'center';
        }

        // Imagen portada
        if (data.imagen_portada) {
          document.getElementById('imagen-portada').src = data.imagen_portada;
        }

        // Texto principal
        document.getElementById('texto-body').textContent = data.texto_body || '';

        // Imagen superior izquierda
        if (data.imagen_superior_izq) {
          document.getElementById('imagen-superior-izq').src = data.imagen_superior_izq;
        }

        // Imagen medio derecha
        if (data.imagen_medio_derecha) {
          document.getElementById('imagen-medio-derecha').src = data.imagen_medio_derecha;
        }
      })
      .catch(error => console.error('Error cargando eventos.json:', error));
  </script>
</body>
</html>
